services:
  db:
    restart: unless-stopped  # 电脑重启、Docker 重新启动后自动拉起
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support"]
      interval: 5s
      retries: 10

  backend:
    restart: unless-stopped  # 电脑重启、Docker 重新启动后自动拉起
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://support:support@db:5432/support
      ATTACHMENT_DIR: /data/attachments
    # AI 与企业微信的密钥写在 backend/.env（参考 .env.example），不要提交到仓库
    env_file:
      - path: ./backend/.env
        required: false
    # 企业微信会话存档：把官方 SDK 和解密私钥放到 ./secrets/wecom 下
    volumes:
      - ./secrets/wecom:/opt/wecom:ro
      # 图片、文件附件
      - attachments:/data/attachments
    # 让容器能访问本机端口（如转到内网 embedding 服务的 SSH 隧道）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    restart: unless-stopped  # 电脑重启、Docker 重新启动后自动拉起
    build: ./web
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  attachments:
