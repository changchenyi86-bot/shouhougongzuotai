# 复制为 config.ini 后修改，或运行 1-install.bat 按提示填写
[server]
url = http://192.168.1.20:8000
token = 和服务器上 SEND_AGENT_TOKEN 一样的口令
agent_id = 客服电脑1

[agent]
poll_seconds = 3
# 领任务时让工作台最多留着请求多少秒：一有任务马上交过来，不用等下一次询问。0 = 关闭，改回每 poll_seconds 秒问一次
long_poll_seconds = 20
heartbeat_seconds = 15
min_interval_seconds = 5

# [ui] 由 2-calibrate.bat 自动填写
